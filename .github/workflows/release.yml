name: Build release on Windows and Linux with PyPy3

on:
  push:
    tags:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x86_64
            ext: ''
          - os: windows-2022
            platform: windows
            arch: x86_64
            ext: '.exe'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 切换为配置 PyPy3 环境
      - name: Set up PyPy3
        uses: actions/setup-python@v5
        with:
          python-version: 'pypy3.10'

      # 2. 用 PyPy3 的 pip 安装 Nuitka 依赖
      - name: Upgrade pip and ensure Nuitka installed
        run: |
          pypy3 -m pip install --upgrade pip
          pypy3 -m pip install --upgrade nuitka ordered-set zstandard

      - name: Install dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache patchelf upx

      - name: Install dependencies (Windows)
        if: matrix.platform == 'windows'
        run: |
          choco install upx -y

      # 3. Linux 环境打包（移除了不支持的 python-flag，开启了 upx 插件）
      - name: Build with Nuitka (Linux)
        if: matrix.platform == 'linux'
        run: |
          pypy3 -m nuitka \
            --standalone \
            --onefile \
            --assume-yes-for-downloads \
            --lto=yes \
            --output-filename=energy-battle-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.ext }} \
            --include-data-files=localize.py=localize.py \
            --nofollow-import-to=tkinter \
            --nofollow-import-to=unittest \
            --nofollow-import-to=test \
            --nofollow-import-to=distutils \
            --nofollow-import-to=setuptools \
            --nofollow-import-to=pip \
            --remove-output \
            --enable-plugin=anti-bloat \
            --enable-plugin=upx \
            ark.py

      # 4. Windows 环境打包（显式指定了 upx.exe 的绝对路径）
      - name: Build with Nuitka (Windows)
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          pypy3 -m nuitka ^
            --standalone ^
            --onefile ^
            --assume-yes-for-downloads ^
            --lto=yes ^
            --output-filename=energy-battle-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.ext }} ^
            --include-data-files=localize.py=localize.py ^
            --nofollow-import-to=tkinter ^
            --nofollow-import-to=unittest ^
            --nofollow-import-to=test ^
            --nofollow-import-to=distutils ^
            --nofollow-import-to=setuptools ^
            --nofollow-import-to=pip ^
            --remove-output ^
            --enable-plugin=anti-bloat ^
            --enable-plugin=upx ^
            --upx-binary=C:\ProgramData\chocolatey\bin\upx.exe ^
            ark.py

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: energy-battle-${{ matrix.platform }}-${{ matrix.arch }}
          path: energy-battle-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.ext }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: energy-battle-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.ext }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

