name: Compilation based on PyInstaller, Pypy3 and upx

on:
  push:
    tags:
      - '*'   # 任意 tag 都触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: x86_64
            ext: ''
          - os: windows-2022
            platform: windows
            arch: x86_64
            ext: '.exe'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PyPy
        uses: actions/setup-python@v5
        with:
          python-version: 'pypy3.12'

      - name: Upgrade pip and install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller ordered-set zstandard

      - name: Install dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl

      - name: Install dependencies (Windows)
        if: matrix.platform == 'windows'
        run: |
          choco install upx -y

      - name: Build with PyInstaller (Linux)
        if: matrix.platform == 'linux'
        run: |
          pyinstaller \
            --onefile \
            --name energy-battle-${{ matrix.platform }}-${{ matrix.arch }} \
            --add-data "localize.py:." \
            --clean \
            ark.py

      - name: Build with PyInstaller (Windows)
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          pyinstaller ^
            --onefile ^
            --name energy-battle-${{ matrix.platform }}-${{ matrix.arch }} ^
            --add-data "localize.py;." ^
            --clean ^
            ark.py


      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: energy-battle-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/energy-battle-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.ext }}


      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/energy-battle-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.ext }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

